name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-deploy-role
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t production-ai-api:${{ github.sha }} .
          docker tag production-ai-api:${{ github.sha }} 123456789012.dkr.ecr.us-east-1.amazonaws.com/production-ai-api:${{ github.sha }}

      - name: Push image to ECR
        run: |
          docker push 123456789012.dkr.ecr.us-east-1.amazonaws.com/production-ai-api:${{ github.sha }}

      - name: Deploy to EC2
        run: |
          echo "Replace with EC2 SSH or SSM deployment commands for the target host."
          echo "Pull image, stop old container, start new container, and health check."

      - name: Health check
        run: |
          echo "curl -f http://<ec2-host>/health || exit 1"
