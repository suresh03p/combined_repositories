[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layout-aware-document-intelligence"
version = "0.1.0"
description = "A page- and layout-preserving document ingestion exercise."
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "PyMuPDF>=1.23",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
    "Pillow>=10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]